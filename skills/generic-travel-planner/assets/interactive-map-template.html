<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trip Plan Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; color: #17212f; }
    .shell { display: grid; grid-template-columns: minmax(360px, 42vw) 1fr; height: 100%; }
    .content { overflow: auto; padding: 18px; border-right: 1px solid #d8dee8; background: #f7f9fc; }
    #map { min-height: 100vh; height: 100%; }
    .switch { position: sticky; top: 0; z-index: 500; display: flex; gap: 10px; background: #f7f9fc; padding-bottom: 12px; }
    select { width: 100%; min-height: 36px; border: 1px solid #d8dee8; border-radius: 8px; padding: 0 10px; font-weight: 700; }
    h1 { margin: 0 0 10px; font-size: 24px; }
    h2 { margin: 20px 0 8px; font-size: 18px; }
    p, li, td, th { font-size: 13px; line-height: 1.55; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #d8dee8; border-radius: 8px; overflow: hidden; }
    th, td { padding: 8px 9px; border-bottom: 1px solid #d8dee8; text-align: left; vertical-align: top; }
    th { width: 82px; background: #eef3f9; }
    .card { padding: 12px; background: #fff; border: 1px solid #d8dee8; border-radius: 8px; margin: 10px 0; }
    .marker-label { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
    .base { background: #5f6b7a; }
    .day1 { background: #2364d2; }
    .day2 { background: #d65a1f; }
    .day3 { background: #18865a; }
    .food { background: #9a6b00; }
    .name-label { padding: 3px 7px; border: 1px solid rgba(36,54,78,.22); border-radius: 6px; background: rgba(255,255,255,.94); color: #1f2a3a; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .name-label.is-hidden { display: none; }
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; grid-template-rows: 52vh auto; }
      #map { min-height: 52vh; order: 1; }
      .content { order: 2; border-right: 0; border-top: 1px solid #d8dee8; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="content">
      <div class="switch">
        <label for="version-select">路线版本</label>
        <select id="version-select">
          <option value="v1">v1 baseline</option>
          <option value="v2">v2 alternative</option>
        </select>
      </div>
      <h1 id="title">City Trip Plan</h1>
      <div class="card">
        <p id="assumptions">State assumptions, uncertain coordinates, and current-date caveats here.</p>
      </div>
      <h2>总路线</h2>
      <table>
        <tr><th>去程</th><td id="route-outbound"></td></tr>
        <tr><th>核心日</th><td id="route-core"></td></tr>
        <tr><th>返程</th><td id="route-return"></td></tr>
      </table>
      <h2 id="day-title">Day Plan</h2>
      <table id="day-table"></table>
      <h2>餐厅安排</h2>
      <div class="card"><ul id="food-plan"></ul></div>
    </section>
    <div id="map"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { scrollWheelZoom: true });
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);

    const points = [
      { id: 'A', name: 'Origin/Base', pos: [39.9, 116.4], cls: 'base', note: 'Replace with real base.' },
      { id: '1', name: 'Attraction', pos: [39.95, 116.45], cls: 'day1', note: 'Opening/ticket notes.' },
      { id: '食', name: 'Restaurant', pos: [39.94, 116.42], cls: 'food', note: 'Phone, address, link, queue and parking notes.' }
    ];

    const versions = {
      v1: {
        outbound: 'Origin -> Base -> Attraction',
        core: 'Base -> Attraction -> Food -> Base',
        return: 'Base -> Return corridor',
        dayTitle: 'Day Plan',
        rows: [['08:00', 'Depart base.'], ['10:00', 'Visit attraction.'], ['12:30', 'Lunch.']],
        food: ['Lunch: Restaurant A. Backup: Restaurant B.']
      },
      v2: {
        outbound: 'Origin -> Base',
        core: 'Base -> Alternative attraction -> Food -> Base',
        return: 'Base -> Return corridor',
        dayTitle: 'Alternative Day Plan',
        rows: [['07:30', 'Depart earlier.'], ['09:30', 'Visit alternative attraction.'], ['12:30', 'Lunch.']],
        food: ['Lunch: Restaurant C. Backup: quick meal nearby.']
      }
    };

    function icon(p) {
      return L.divIcon({
        className: '',
        html: `<div class="marker-label ${p.cls}">${p.id}</div>`,
        iconSize: [34, 34],
        iconAnchor: [17, 17],
        popupAnchor: [0, -16]
      });
    }

    const markerRefs = points.map(point => {
      const marker = L.marker(point.pos, { icon: icon(point) })
        .addTo(map)
        .bindPopup(`<strong>${point.name}</strong><br>${point.note}`)
        .bindTooltip(point.name, { permanent: true, direction: 'top', offset: [0, -18], className: 'name-label is-hidden' });
      return { point, marker };
    });

    function renderRows(rows) {
      return rows.map(([time, text]) => `<tr><th>${time}</th><td>${text}</td></tr>`).join('');
    }

    function renderList(items) {
      return items.map(item => `<li>${item}</li>`).join('');
    }

    function applyVersion(version) {
      const data = versions[version];
      document.querySelector('#route-outbound').textContent = data.outbound;
      document.querySelector('#route-core').textContent = data.core;
      document.querySelector('#route-return').textContent = data.return;
      document.querySelector('#day-title').textContent = data.dayTitle;
      document.querySelector('#day-table').innerHTML = renderRows(data.rows);
      document.querySelector('#food-plan').innerHTML = renderList(data.food);
    }

    function updateLabels() {
      const zoom = map.getZoom();
      markerRefs.forEach(({ marker }) => {
        const el = marker.getTooltip() && marker.getTooltip().getElement();
        if (el) el.classList.toggle('is-hidden', zoom < 9);
      });
    }

    document.querySelector('#version-select').addEventListener('change', event => applyVersion(event.target.value));
    map.on('zoomend moveend', updateLabels);
    map.fitBounds(L.latLngBounds(points.map(p => p.pos)).pad(0.2));
    applyVersion('v1');
    setTimeout(updateLabels, 0);
  </script>
</body>
</html>
